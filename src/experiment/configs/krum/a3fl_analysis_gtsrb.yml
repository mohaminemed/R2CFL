experiment_name: 'a3fl_krum_gtsrb_noniid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'gtsrb'
  root: 'data'
  download: true
  strategy: 'dirichlet'  #'iid'  #
  alpha: 0.5
  
fl_params:
  num_clients: 30
  clients_per_round: 30 
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: "a3fl"
  malicious_client_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8] 
  
  poison_fraction: 0.25 
  target_label: 7 
  attack_start_round: 60 
  attack_end_round: 80
  malicious_epochs: 5 
  trigger:
    name: 'a3fl'
    kwargs:
      in_channels: 3         
      image_size: [32, 32]   
      position: [28, 28]     
      size: [3, 3]
      # Hyperparameters for the trigger optimization process
      trigger_lr: 0.01
      lambda_balance: 0.1
      adv_epochs: 100
      adv_lr: 0.01

defense_params:
  enabled: true # Enable the analysis server
  name: 'krum'
  # --- Krum specific parameters ---
  krum_f: 5
  krum_m: 20