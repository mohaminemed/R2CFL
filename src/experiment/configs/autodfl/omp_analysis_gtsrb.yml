experiment_name: 'omp_autodfl_gtsrb_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'gtsrb'
  root: 'data'
  download: true
  strategy: 'iid' #'dirichlet' 
  alpha: 0.5
  load_pretrained: false
  load_model_path: "./src/pretrained/gtsrb.pth"
  
fl_params:
  num_clients: 20
  clients_per_round: 20 
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: "omp"
  malicious_client_ids: [0, 1, 2, 3, 4, 5] 
  attack_start_round: 1 
  attack_end_round: 100
 


defense_params:
  enabled: true # Enable the analysis server
  name: 'autodfl'
  # --- specific parameters ---
  keep_ratio: 0.7