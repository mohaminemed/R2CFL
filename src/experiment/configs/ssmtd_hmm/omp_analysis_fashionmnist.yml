experiment_name: 'omp_ssmtd_hmm_fashion_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'fashionmnist'
  root: 'data'
  download: true
  strategy: 'iid'  #'dirichlet'  
  alpha: 0.5
  
fl_params:
  num_clients: 100
  clients_per_round: 100
  num_rounds: 10

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: 'omp' 
  malicious_client_ids: [0, 1, 2, 3, 4, 5] # Example: Clients 0 and 1 are attackers
  attack_start_round: 1
  attack_end_round: 100


defense_params:
  enabled: true # Enable the analysis server
  name: 'ssmtd_hmm'
  # --- SSMTD specific parameters ---
  beta: 0.2 # HMM smoothing factor