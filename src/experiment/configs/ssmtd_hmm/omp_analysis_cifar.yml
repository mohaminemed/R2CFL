experiment_name: 'omp_ssmtd_hmm_cifar_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'cifar10'
  root: 'data'
  download: true
  strategy: 'iid'  # 'dirichlet'
  alpha: 0.5
  load_pretrained: false

  
fl_params:
  num_clients: 20
  clients_per_round: 20 
  num_rounds: 200

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: "omp"
  malicious_client_ids: [0, 1, 2, 3, 4, 5] 
  attack_start_round: 1 
  attack_end_round: 200
 


defense_params:
  enabled: true # Enable the analysis server
  name: 'ssmtd_hmm'
