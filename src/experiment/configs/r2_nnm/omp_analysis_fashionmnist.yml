experiment_name: 'omp_r2_nnm_fashion_noniid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'fashionmnist'
  root: 'data'
  download: true
  strategy: 'dirichlet'  #
  alpha: 0.5
  
fl_params:
  num_clients: 20
  clients_per_round: 20
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: 'omp' 
  malicious_client_ids: [0, 1, 2, 3, 4, 5] # Example: Clients 0 and 1 are attackers
  attack_start_round: 1
  attack_end_round: 100



defense_params:
  enabled: true # Enable the analysis server
  name: 'r2_nnm'
  # --- NNM specific parameters ---
  bucket_size: 2
  base_defense: 'krum' 
  nnm_k: 10
  krum_f: 5
  krum_m: 13